[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acro"
version = "0.1.0"
description = "AI tone authoring for the HeadRush Core - research a song's guitar tone, build the rig over Wi-Fi, and test it against the source."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gavin Boley" }]
keywords = ["headrush", "guitar", "amp-modeler", "nam", "neural-amp-modeler", "mcp", "tone-matching"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "click>=8.0",
  "httpx>=0.27",
  "websockets>=12",
  "zeroconf>=0.132",
  "numpy>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
audio = ["scipy>=1.11", "soundfile>=0.12", "sounddevice>=0.4"]
match = ["scipy>=1.11", "soundfile>=0.12", "librosa>=0.10"]
browser = ["playwright>=1.40"]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
all = [
  "mcp>=1.2", "mido>=1.3", "python-rtmidi>=1.5",
  "scipy>=1.11", "soundfile>=0.12", "sounddevice>=0.4",
  "librosa>=0.10", "playwright>=1.40",
]

[project.scripts]
acro = "acro.cli:main"

[project.urls]
Homepage = "https://github.com/Gavinboley/acro-plan"
Source = "https://github.com/Gavinboley/acro-plan"

[tool.setuptools.packages.find]
include = ["acro*"]

[tool.setuptools.package-data]
"acro.protocol" = ["maps/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
