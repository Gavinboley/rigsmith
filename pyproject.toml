[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigsmith"
version = "0.1.0"
description = "AI tone authoring for the HeadRush Core - research a song's guitar tone, build the rig over Wi-Fi, and test it against the source."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gavin Boley" }]
keywords = ["headrush", "guitar", "amp-modeler", "nam", "neural-amp-modeler", "mcp", "tone-matching"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "click>=8.0",
  "httpx>=0.27",
  "websockets>=12",
  "zeroconf>=0.132",
  "numpy>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
audio = ["scipy>=1.11", "soundfile>=0.12", "sounddevice>=0.4"]
match = ["scipy>=1.11", "soundfile>=0.12"]
separation = ["demucs>=4.0"]
codecs = ["av>=12"]
browser = ["playwright>=1.40"]
claude = ["anthropic>=1.0"]
tune = ["optuna>=4.0"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "httpx>=0.27"]
all = [
  "mcp>=2.0", "fastapi>=0.115", "uvicorn>=0.30",
  "mido>=1.3", "python-rtmidi>=1.5",
  "scipy>=1.11", "soundfile>=0.12", "sounddevice>=0.4",
  "playwright>=1.40",
  "anthropic>=1.0", "optuna>=4.0", "av>=12",
  # pytest-asyncio belongs here too: without it tests/test_mcp_tools.py
  # silently collects zero items, so `pip install -e ".[all]" && pytest`
  # reported a green run that had never exercised the MCP contracts.
  "pytest>=7", "pytest-asyncio>=0.23",
]

[project.scripts]
rigsmith = "rigsmith.cli:main"

[project.urls]
Homepage = "https://github.com/Gavinboley/rigsmith"
Source = "https://github.com/Gavinboley/rigsmith"

[tool.setuptools.packages.find]
include = ["rigsmith*"]

[tool.setuptools.package-data]
"rigsmith.protocol" = ["maps/*.json"]
"rigsmith.web" = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
